<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Ripster Cloud Screener</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RipsterCloud">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{
    --bg:#0a0e14; --panel:#11161f; --panel2:#161d29; --border:#232c3a;
    --text:#e6edf3; --dim:#7d8899; --cyan:#33e0ff; --green:#20d67b;
    --red:#FC0400; --amber:#ffb020; --accent:#4d7fff;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
  header h1{font-size:16px;margin:0;letter-spacing:.3px;}
  header h1 span{color:var(--cyan);}
  .icon-btn{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px;}
  .icon-btn:hover{border-color:var(--accent);}
  .icon-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{padding:12px;max-width:1600px;margin:0 auto;}
  .layout{display:flex;gap:14px;align-items:flex-start;}
  .sidebar{flex:0 0 320px;max-width:320px;max-height:calc(100vh - 200px);overflow:auto;border-radius:10px;}
  .chart-col{flex:1;min-width:0;}
  .chart-placeholder{background:var(--panel);border:1px dashed var(--border);border-radius:10px;padding:60px 20px;text-align:center;color:var(--dim);font-size:14px;}
  @media (max-width:900px){
    .layout{flex-direction:column;}
    .sidebar{display:none !important;}
  }
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
  .toolbar-more{display:contents;}
  #toolbarMoreBtn{display:none;}
  .toolbar button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13px;}
  .toolbar button.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text);}
  .toolbar button:disabled{opacity:.5;cursor:not-allowed;}
  .toolbar label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--dim);}
  .toolbar select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px;}
  #status{font-size:12px;color:var(--dim);margin-left:auto;}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:13px;}
  thead th{text-align:left;padding:10px 8px;background:var(--panel2);color:var(--dim);font-weight:600;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:#151c28;}
  tbody tr.selected{background:#132033;}
  .sym{font-weight:700;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;}
  .dot.g{background:var(--green);}
  .dot.r{background:var(--red);}
  .dot.n{background:#3a4454;}
  .pill{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700;}
  .pill.g{background:rgba(32,214,123,.15);color:var(--green);}
  .pill.r{background:rgba(252,4,0,.12);color:var(--red);}
  .pill.match{background:rgba(51,224,255,.15);color:var(--cyan);border:1px solid rgba(51,224,255,.4);}
  .trendval{font-weight:700;font-size:14px;}
  .trendval.up{color:var(--green);}
  .trendval.down{color:var(--red);}
  .trendval.dim{color:var(--dim);font-weight:400;}
  #chartPanel{margin-top:0;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;display:none;}
  #chartPanel.open{display:block;}
  .sidebar thead th{position:sticky;top:0;z-index:2;}
  #chartHeader{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px;}
  #chartHeader .sym{font-size:18px;}
  #chartHeader .price{font-size:15px;color:var(--dim);}
  .chart-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .chart-controls select{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:12px;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--dim);margin-left:auto;}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend i{width:10px;height:6px;display:inline-block;border-radius:2px;}
  #chartWrap{position:relative;width:100%;height:480px;}
  #chart{position:absolute;inset:0;}
  #overlay{position:absolute;inset:0;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;pointer-events:none;}
  #overlay.tool-active{cursor:crosshair;pointer-events:auto;}
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:16px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto;}
  .modal h2{margin-top:0;font-size:15px;}
  .modal label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px;}
  .modal input,.modal select,.modal textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 10px;font-size:13px;font-family:inherit;}
  .modal textarea{min-height:90px;resize:vertical;}
  .modal .row{display:flex;gap:8px;margin-top:18px;}
  .modal .row button{flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;font-weight:600;}
  .modal .checkrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);margin:6px 0;}
  .modal .row3{display:flex;gap:8px;flex-wrap:wrap;}
  .modal .row3>div{flex:1;min-width:90px;}
  .modal .row3 label{margin:0 0 4px;}
  .modal .save{background:var(--accent);color:#fff;}
  .modal .cancel{background:var(--panel2);color:var(--text);border:1px solid var(--border) !important;}
  .empty{padding:40px;text-align:center;color:var(--dim);}
  thead th[data-sort]{cursor:pointer;user-select:none;}
  thead th[data-sort]:hover{color:var(--text);}
  #progressWrap{display:none;height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-bottom:10px;}
  #progressWrap.on{display:block;}
  #progressBar{height:100%;background:var(--cyan);width:0%;transition:width .2s;}
  @media (max-width:640px){
    #chartWrap{height:340px;}
    .icon-btn{padding:10px 12px;font-size:15px;}
    .chart-controls{width:100%;}
    .chart-controls label{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px;}
    .legend{width:100%;order:5;}

    #toolbarMoreBtn{display:inline-flex;}
    .toolbar-more{display:none;flex-direction:column;align-items:stretch;gap:12px;width:100%;order:10;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-top:2px;}
    .toolbar-more.open{display:flex;}
    .toolbar-more label{justify-content:space-between;}
    .toolbar-more button{width:100%;}
    #status{width:100%;margin-left:0;order:9;}

    table{font-size:15px;}
    thead th{padding:12px 10px;font-size:12px;}
    tbody td{padding:15px 10px;}
    tbody tr{min-height:48px;}
    .sym{font-size:15px;}
    .trendval{font-size:17px;}
  }
</style>
</head>
<body>

<header>
  <h1>Ripster <span>Cloud</span> Screener</h1>
  <button class="icon-btn" id="settingsBtn">⚙ Settings</button>
</header>

<main>
  <div class="toolbar">
    <button id="scanBtn">Run Scan</button>
    <button class="secondary" id="refreshBtn">Refresh</button>
    <button class="secondary" id="toolbarMoreBtn" aria-expanded="false">⋯ More</button>
    <span id="status">Not connected</span>

    <div class="toolbar-more" id="toolbarMore">
      <button class="secondary" id="conditionsBtn">⚙ Conditions</button>
      <label>Timeframe
        <select id="tf">
          <option value="4Hour" selected>4H</option>
          <option value="1Day">1D</option>
        </select>
      </label>
      <label><input type="checkbox" id="hitsOnly" checked> Hits only</label>
      <label><input type="checkbox" id="autoRefresh"> Auto-refresh
        <select id="autoRefreshInterval">
          <option value="1">1m</option>
          <option value="2">2m</option>
          <option value="5" selected>5m</option>
          <option value="15">15m</option>
        </select>
      </label>
      <label><input type="checkbox" id="notifyOnHits"> Notify on hits</label>
      <button class="secondary" id="exportCsvBtn">⬇ CSV</button>
    </div>
  </div>
  <div id="progressWrap"><div id="progressBar"></div></div>

  <div class="layout">
    <aside class="sidebar">
      <table>
        <thead>
          <tr>
            <th data-sort="symbol">Symbol</th>
            <th data-sort="bars4h">4H</th>
            <th data-sort="bars1d">1D</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr><td colspan="3" class="empty">Set your Alpaca keys in Settings, then Run Scan.</td></tr>
        </tbody>
      </table>
    </aside>

    <section class="chart-col">
      <div id="chartPlaceholder" class="chart-placeholder">Select a symbol or run scan to view charts</div>
      <div id="chartPanel">
        <div id="chartHeader">
          <span class="sym" id="chartSym">—</span>
          <span class="price" id="chartPrice"></span>

          <div class="chart-controls">
            <label><input type="checkbox" id="showMagicTrend" checked> Show MagicTrend</label>
            <button class="icon-btn" id="toolLine" title="Draw Trendline">📏 Line</button>
            <button class="icon-btn" id="toolHLine" title="Draw Horizontal Level">➖ H-Level</button>
            <button class="icon-btn" id="toolFree" title="Freehand Pen">✏ Pen</button>
            <button class="icon-btn" id="clearDrawings" title="Clear Canvas Drawings">🗑 Clear</button>
            <button class="icon-btn" id="exportBtn" style="color:var(--cyan);font-weight:600;">📷 Export Chart</button>
            <button class="icon-btn" id="playPauseBtn" title="Auto-cycle through charts">▶ Play</button>
            <select id="playInterval" title="Time between charts">
              <option value="2">2s</option>
              <option value="3" selected>3s</option>
              <option value="5">5s</option>
              <option value="10">10s</option>
            </select>
          </div>

          <div class="legend">
            <span><i style="background:rgba(32,214,123,0.5)"></i>Ripster 5-13</span>
            <span><i style="background:rgba(51,224,255,0.4)"></i>Ripster 34-50</span>
            <span><i style="background:#20d67b"></i>MagicTrend Up</span>
            <span><i style="background:#FC0400"></i>MagicTrend Down</span>
          </div>
          <button class="icon-btn" id="closeChart">✕</button>
        </div>
        <div id="chartWrap">
          <div id="chart"></div>
          <canvas id="overlay"></canvas>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>Alpaca Settings</h2>
    <label>API Key ID</label>
    <input id="apiKey" type="text" autocomplete="off">
    <label>API Secret Key</label>
    <input id="apiSecret" type="password" autocomplete="off">
    <label>Data Feed</label>
    <select id="feed">
      <option value="iex">iex (free)</option>
      <option value="sip">sip (paid/unlimited)</option>
    </select>
    <label>Watchlist (comma or newline separated)</label>
    <textarea id="watchlist" spellcheck="false"></textarea>
    <div class="row">
      <button class="cancel" id="cancelSettings">Cancel</button>
      <button class="save" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="conditionsModal">
  <div class="modal">
    <h2>Scan Conditions</h2>

    <label>Match logic</label>
    <select id="matchMode">
      <option value="all">Require ALL selected conditions</option>
      <option value="any">Require ANY selected condition</option>
    </select>

    <label>Conditions to include in a match</label>
    <label class="checkrow"><input type="checkbox" id="condEma5gt13"> EMA5 &gt; EMA13</label>
    <label class="checkrow"><input type="checkbox" id="condEma13gt34"> EMA13 &gt; EMA34</label>
    <label class="checkrow"><input type="checkbox" id="condBullish"> Bullish</label>
    <label class="checkrow"><input type="checkbox" id="condMagicGreen"> MagicTrend Green</label>
    <label class="checkrow"><input type="checkbox" id="condTrendFlip"> MagicTrend Flip (line just turned green)</label>

    <label>MagicTrend parameters</label>
    <div class="row3">
      <div><label>CCI Period</label><input type="number" id="pCciPeriod" min="2" step="1"></div>
      <div><label>ATR Period</label><input type="number" id="pAtrPeriodMT" min="1" step="1"></div>
      <div><label>ATR Multiplier</label><input type="number" id="pAtrMultMT" min="0" step="0.1"></div>
    </div>

    <label>Bullish parameters</label>
    <div class="row3">
      <div><label>Fast EMA</label><input type="number" id="pBullFastEma" min="1" step="1"></div>
      <div><label>Slow EMA</label><input type="number" id="pBullSlowEma" min="1" step="1"></div>
      <div><label>RSI Period</label><input type="number" id="pRsiPeriod" min="1" step="1"></div>
      <div><label>RSI Threshold</label><input type="number" id="pRsiThreshold" min="0" max="100" step="1"></div>
      <div><label>Cloud × ATR</label><input type="number" id="pCloudAtrFactor" min="0" step="0.05"></div>
    </div>

    <div class="row">
      <button class="cancel" id="cancelConditions">Cancel</button>
      <button class="save" id="applyConditions">Apply &amp; Scan</button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const LS_KEY = "ripster_screener_cfg_v1";
function loadCfg(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; }
}
function saveCfg(cfg){ localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }

const TIMEFRAMES = ["4Hour", "1Day"];

const BAR_CACHE_KEY = "ripster_screener_barcache_v2";
function loadBarCaches(){
  try{
    const raw = JSON.parse(localStorage.getItem(BAR_CACHE_KEY));
    if(raw && raw.feed === cfg.feed && raw.tf){
      TIMEFRAMES.forEach(tf => { if(!raw.tf[tf]) raw.tf[tf] = { bars:{} }; });
      return raw.tf;
    }
  }catch(e){}
  const fresh = {};
  TIMEFRAMES.forEach(tf => fresh[tf] = { bars:{} });
  return fresh;
}
function saveBarCaches(caches){
  try{ localStorage.setItem(BAR_CACHE_KEY, JSON.stringify({ feed: cfg.feed, tf: caches })); }
  catch(e){}
}
function mergeBars(oldBars, newBars){
  const map = new Map();
  for(const b of oldBars) map.set(b.t, b);
  for(const b of newBars) map.set(b.t, b);
  return Array.from(map.values()).sort((a,b)=> new Date(a.t) - new Date(b.t));
}
function trimBarsToRange(bars, startIso){
  const startMs = new Date(startIso).getTime();
  return bars.filter(b => new Date(b.t).getTime() >= startMs);
}

const DEFAULT_PARAMS = {
  cciPeriod: 20, atrPeriodMT: 5, atrMultMT: 1,
  bullFastEma: 10, bullSlowEma: 21, rsiPeriod: 14, rsiThreshold: 50, cloudAtrFactor: 0.3
};
const DEFAULT_CONDITIONS = { ema5gt13: true, ema13gt34: true, bullish: true, magicGreen: true, trendFlip: false };

let cfg = Object.assign({
  apiKey: "", apiSecret: "", feed: "iex", timeframe: "4Hour",
  watchlist: "AA, AAL, ABBV, ABT, ACB, ACN, ADBE, ADSK, AFRM, AGNC, ALHC, AMD, AMZN, APP, ARM, ASPI, ASTS, AVDL, AXON, B, BA, BABA, BAC, BAM, BE, BMY, BULL, C, CARR, CAVA, CC, CCJ, CCL, CELH, CHWY, CLMT, CLOV, CLSK, CMG, CNQ, CORZ, COST, COTY, CPNG, CRM, CRML, CRWD, CRWV, CVNA, CVS, DAR, DBX, DELL, DJT, DKNG, DOW, EBAY, ENPH, ENR, EQX, EXE, F, FCX, FDX, FSLR, GILD, GILT, GM, GME, GOOG, GOOGL, HIMS, HOOD, HPE, HPQ, HUT, INTC, IQ, IREN, IWM, JBLU, JD, JMIA, JNJ, JPM, KHC, KMI, KO, KSS, LLY, LOW, LULU, LUV, LVS, LYFT, MARA, MBLY, MBOT, META, MNDY, MO, MRK, MRVL, MSFT, MU, NEE, NEXT, NFLX, NIO, NKE, NU, NVDA, ONDS, OPEN, OWL, OXY, PBR, PCG, PDD, PEP, PFE, PG, PGEN, PINS, PLTR, PSKY, QBTS, QCOM, QD, QQQ, QS, RELY, RGTI, RIOT, RIVN, RKT, ROKU, RTX, SATS, SBUX, SERV, SLV, SMCI, SNAP, SOFI, SOUN, SPY, T, TCOM, TDOC, TEVA, TGT, TIGR, TMUS, TNA, TRMD, TSLA, TTD, U, UAL, UBER, UPS, UPST, VALE, VZ, WDC, WMT, WULF, XLE, XLF, XOM, XPEV, Z",
  matchMode: "all",
  hitsOnly: true,
  autoRefresh: false, autoRefreshMinutes: 5, notifyOnHits: false,
  conditions: Object.assign({}, DEFAULT_CONDITIONS),
  params: Object.assign({}, DEFAULT_PARAMS)
}, loadCfg());

let barCaches = loadBarCaches();

const els = id => document.getElementById(id);
const settingsModal = els("settingsModal");

els("tf").value = cfg.timeframe;
els("tf").onchange = ()=>{
  cfg.timeframe = els("tf").value;
  saveCfg(cfg);
  updateStatus();
};

function openSettings(){
  els("apiKey").value = cfg.apiKey;
  els("apiSecret").value = cfg.apiSecret;
  els("feed").value = cfg.feed;
  els("watchlist").value = cfg.watchlist;
  settingsModal.classList.add("open");
}
els("settingsBtn").onclick = openSettings;

els("toolbarMoreBtn").onclick = ()=>{
  const panel = els("toolbarMore");
  const open = panel.classList.toggle("open");
  els("toolbarMoreBtn").setAttribute("aria-expanded", String(open));
  els("toolbarMoreBtn").textContent = open ? "▲ Less" : "⋯ More";
};
els("cancelSettings").onclick = ()=> settingsModal.classList.remove("open");
els("saveSettings").onclick = ()=>{
  cfg.apiKey = els("apiKey").value.trim();
  cfg.apiSecret = els("apiSecret").value.trim();
  cfg.feed = els("feed").value;
  cfg.watchlist = els("watchlist").value.trim();
  saveCfg(cfg);
  settingsModal.classList.remove("open");
  updateStatus();
};
function updateStatus(){
  const tfLabel = cfg.timeframe === "1Day" ? "1D" : "4H";
  els("status").textContent = cfg.apiKey && cfg.apiSecret
    ? `Connected · feed=${cfg.feed} · tf=${tfLabel} · ${parseWatchlist().length} symbols`
    : "Not connected — open Settings";
}

const conditionsModal = els("conditionsModal");
function openConditions(){
  els("matchMode").value = cfg.matchMode;
  els("condEma5gt13").checked = cfg.conditions.ema5gt13;
  els("condEma13gt34").checked = cfg.conditions.ema13gt34;
  els("condBullish").checked = cfg.conditions.bullish;
  els("condMagicGreen").checked = cfg.conditions.magicGreen;
  els("condTrendFlip").checked = cfg.conditions.trendFlip;
  els("pCciPeriod").value = cfg.params.cciPeriod;
  els("pAtrPeriodMT").value = cfg.params.atrPeriodMT;
  els("pAtrMultMT").value = cfg.params.atrMultMT;
  els("pBullFastEma").value = cfg.params.bullFastEma;
  els("pBullSlowEma").value = cfg.params.bullSlowEma;
  els("pRsiPeriod").value = cfg.params.rsiPeriod;
  els("pRsiThreshold").value = cfg.params.rsiThreshold;
  els("pCloudAtrFactor").value = cfg.params.cloudAtrFactor;
  conditionsModal.classList.add("open");
}
els("conditionsBtn").onclick = openConditions;
els("cancelConditions").onclick = ()=> conditionsModal.classList.remove("open");
els("applyConditions").onclick = ()=>{
  cfg.matchMode = els("matchMode").value;
  cfg.conditions = {
    ema5gt13: els("condEma5gt13").checked,
    ema13gt34: els("condEma13gt34").checked,
    bullish: els("condBullish").checked,
    magicGreen: els("condMagicGreen").checked,
    trendFlip: els("condTrendFlip").checked
  };
  const num = (id, fallback) => {
    const v = parseFloat(els(id).value);
    return Number.isFinite(v) ? v : fallback;
  };
  cfg.params = {
    cciPeriod: Math.max(2, Math.round(num("pCciPeriod", DEFAULT_PARAMS.cciPeriod))),
    atrPeriodMT: Math.max(1, Math.round(num("pAtrPeriodMT", DEFAULT_PARAMS.atrPeriodMT))),
    atrMultMT: Math.max(0, num("pAtrMultMT", DEFAULT_PARAMS.atrMultMT)),
    bullFastEma: Math.max(1, Math.round(num("pBullFastEma", DEFAULT_PARAMS.bullFastEma))),
    bullSlowEma: Math.max(1, Math.round(num("pBullSlowEma", DEFAULT_PARAMS.bullSlowEma))),
    rsiPeriod: Math.max(1, Math.round(num("pRsiPeriod", DEFAULT_PARAMS.rsiPeriod))),
    rsiThreshold: Math.min(100, Math.max(0, num("pRsiThreshold", DEFAULT_PARAMS.rsiThreshold))),
    cloudAtrFactor: Math.max(0, num("pCloudAtrFactor", DEFAULT_PARAMS.cloudAtrFactor))
  };
  saveCfg(cfg);
  conditionsModal.classList.remove("open");
  runScan();
};

function parseWatchlist(){
  return cfg.watchlist.split(/[\s,]+/).map(s=>s.trim().toUpperCase()).filter(Boolean);
}
if(!cfg.apiKey || !cfg.apiSecret) setTimeout(openSettings, 300);
updateStatus();

const DATA_BASE = "https://data.alpaca.markets/v2";

function headers(){
  return { "APCA-API-KEY-ID": cfg.apiKey, "APCA-API-SECRET-KEY": cfg.apiSecret };
}

const sleep = ms => new Promise(res => setTimeout(res, ms));

async function fetchMultiBars(symbols, start, end, timeframe, onProgress){
  const out = {};
  symbols.forEach(s=> out[s] = []);
  const CHUNK = 50;
  for(let i=0; i<symbols.length; i+=CHUNK){
    const chunk = symbols.slice(i, i+CHUNK);
    let pageToken = null;
    do{
      const params = new URLSearchParams({
        symbols: chunk.join(","),
        timeframe: timeframe,
        start, end,
        limit: "10000",
        feed: cfg.feed,
        adjustment: "raw"
      });
      if(pageToken) params.set("page_token", pageToken);

      let res;
      let retries = 5;
      let delay = 2000;

      while(retries > 0){
        res = await fetch(`${DATA_BASE}/stocks/bars?${params.toString()}`, { headers: headers() });

        if(res.status === 429){
          console.warn(`Alpaca 429 hit. Pausing for ${delay / 1000}s before retry...`);
          await sleep(delay);
          delay *= 2;
          retries--;
          continue;
        }
        break;
      }

      if(!res.ok){
        const txt = await res.text().catch(()=> "");
        throw new Error(`Alpaca error ${res.status}: ${txt.slice(0,200)}`);
      }

      const json = await res.json();
      const bars = json.bars || {};
      for(const sym of chunk){
        if(bars[sym]) out[sym] = out[sym].concat(bars[sym]);
      }
      pageToken = json.next_page_token || null;

      await sleep(350);
    } while(pageToken);

    if(onProgress) onProgress(Math.min(i+CHUNK, symbols.length), symbols.length);
  }
  return out;
}

function dateRangeFor(timeframe){
  const end = new Date();
  const start = new Date();
  if(timeframe === "1Day"){
    start.setFullYear(start.getFullYear() - 2);
  } else {
    start.setMonth(start.getMonth() - 6);
  }
  return { start: start.toISOString(), end: end.toISOString() };
}

function isRegularSessionBar(iso){
  const d = new Date(iso);
  const parts = {};
  new Intl.DateTimeFormat("en-US", {
    timeZone: "America/New_York", hour12: false,
    weekday: "short", hour: "2-digit", minute: "2-digit"
  }).formatToParts(d).forEach(p => parts[p.type] = p.value);
  if(parts.weekday === "Sat" || parts.weekday === "Sun") return false;
  const mins = parseInt(parts.hour, 10) * 60 + parseInt(parts.minute, 10);
  return mins >= (9*60+30) && mins < (16*60);
}

function EMA(vals, period){
  const out = new Array(vals.length).fill(NaN);
  if(!vals.length) return out;
  const k = 2/(period+1);
  out[0] = vals[0];
  for(let i=1;i<vals.length;i++) out[i] = vals[i]*k + out[i-1]*(1-k);
  return out;
}
function SMA(vals, period){
  const out = new Array(vals.length).fill(NaN);
  let sum = 0;
  for(let i=0;i<vals.length;i++){
    sum += vals[i];
    if(i>=period) sum -= vals[i-period];
    out[i] = i>=period-1 ? sum/period : sum/(i+1);
  }
  return out;
}
function trueRangeSeries(bars){
  const out = new Array(bars.length).fill(0);
  for(let i=0;i<bars.length;i++){
    const h=bars[i].h, l=bars[i].l, pc = i>0?bars[i-1].c:bars[i].c;
    out[i] = Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc));
  }
  return out;
}
function CCI(bars, period){
  const tp = bars.map(b => (b.h+b.l+b.c)/3);
  const smaTp = SMA(tp, period);
  const out = new Array(bars.length).fill(0);
  for(let i=0;i<bars.length;i++){
    const from = Math.max(0, i-period+1);
    const win = tp.slice(from, i+1);
    const mean = smaTp[i];
    const meanDev = win.reduce((s,v)=> s+Math.abs(v-mean), 0) / win.length;
    out[i] = meanDev === 0 ? 0 : (tp[i]-mean) / (0.015*meanDev);
  }
  return out;
}
function RSI(closes, period){
  const out = new Array(closes.length).fill(50);
  let avgGain=0, avgLoss=0;
  for(let i=1;i<closes.length;i++){
    const diff = closes[i]-closes[i-1];
    const gain = Math.max(diff,0), loss = Math.max(-diff,0);
    if(i<=period){
      avgGain += gain/period; avgLoss += loss/period;
      out[i] = 50;
    } else {
      avgGain = (avgGain*(period-1)+gain)/period;
      avgLoss = (avgLoss*(period-1)+loss)/period;
      const rs = avgLoss===0 ? 100 : avgGain/avgLoss;
      out[i] = avgLoss===0 ? 100 : 100 - (100/(1+rs));
    }
  }
  return out;
}
function PVT(closes, volumes){
  const out = new Array(closes.length).fill(0);
  for(let i=1;i<closes.length;i++){
    const prevClose = closes[i-1] || closes[i];
    const diff = closes[i]-prevClose;
    out[i] = out[i-1] + (prevClose!==0 ? (diff/prevClose)*volumes[i] : 0);
  }
  return out;
}

function computeIndicators(rawBars, params){
  params = Object.assign({}, DEFAULT_PARAMS, params || {});
  const bars = rawBars.map(b => ({ t: b.t, o: b.o, h: b.h, l: b.l, c: b.c, v: b.v }));
  const n = bars.length;
  const closes = bars.map(b=>b.c), highs = bars.map(b=>b.h), lows = bars.map(b=>b.l), vols = bars.map(b=>b.v);

  const ema5  = EMA(closes, 5);
  const ema13 = EMA(closes, 13);
  const ema34 = EMA(closes, 34);
  const ema50 = EMA(closes, 50);

  const emaFast = EMA(closes, params.bullFastEma);
  const emaSlow = EMA(closes, params.bullSlowEma);
  const rsi = RSI(closes, params.rsiPeriod);
  const pvt = PVT(closes, vols);
  const signal = SMA(pvt, 21);
  const atr14 = SMA(trueRangeSeries(bars), 14);

  const bullish = new Array(n).fill(false);
  for(let i=0;i<n;i++){
    const cloudHeight = Math.abs(emaFast[i]-emaSlow[i]);
    bullish[i] = pvt[i] > signal[i] && emaFast[i] > emaSlow[i] && rsi[i] > params.rsiThreshold && (cloudHeight > atr14[i]*params.cloudAtrFactor);
  }

  const cci = CCI(bars, params.cciPeriod);
  const atr5 = SMA(trueRangeSeries(bars), params.atrPeriodMT);
  const magicTrend = new Array(n).fill(0);

  for(let i=0;i<n;i++){
    const upT = lows[i] - atr5[i]*params.atrMultMT;
    const downT = highs[i] + atr5[i]*params.atrMultMT;
    const prevMT = i>0 ? magicTrend[i-1] : upT;
    const prevCCI = i>0 ? cci[i-1] : cci[i];

    if(cci[i] >= 0){
      magicTrend[i] = prevCCI < 0 ? upT : Math.max(upT, prevMT);
    } else {
      magicTrend[i] = prevCCI >= 0 ? downT : Math.min(downT, prevMT);
    }
  }

  const magicGreen = new Array(n).fill(false);
  for(let i=0;i<n;i++){
    magicGreen[i] = cci[i] >= 0 && bullish[i] && (closes[i] > magicTrend[i]);
  }

  // Raw MagicTrend color flip: the bar where the trend line switches from red (cci<0) to green (cci>=0).
  // This is the bare "line just turned green" moment (e.g. the CRM chart flip), independent of the
  // stricter magicGreen filter (which also requires the bullish PVT/RSI/cloud confirmation).
  const trendFlipBull = new Array(n).fill(false);
  for(let i=1;i<n;i++){
    trendFlipBull[i] = cci[i] >= 0 && cci[i-1] < 0;
  }

  return { bars, ema5, ema13, ema34, ema50, bullish, magicTrend, magicGreen, trendFlipBull, cci };
}

function trendBarsSinceChange(ind){
  const n = ind.cci.length;
  if(n < 1) return null;
  const dir = ind.cci[n-1] >= 0 ? "up" : "down";
  let bars = 1;
  for(let i = n-2; i >= 0; i--){
    const d = ind.cci[i] >= 0 ? "up" : "down";
    if(d !== dir) break;
    bars++;
  }
  return { bars, dir };
}

function matchFromFlags(flags){
  const active = Object.keys(cfg.conditions).filter(k => cfg.conditions[k]);
  if(!active.length) return false;
  return cfg.matchMode === "any" ? active.some(k => flags[k]) : active.every(k => flags[k]);
}

function isMatchAtBar(ind, i){
  return matchFromFlags({
    ema5gt13: ind.ema5[i] > ind.ema13[i],
    ema13gt34: ind.ema13[i] > ind.ema34[i],
    bullish: ind.bullish[i],
    magicGreen: ind.magicGreen[i],
    trendFlip: ind.trendFlipBull[i]
  });
}

function screenerFlags(ind){
  const n = ind.bars.length;
  if(n < 2) return null;
  const i = n - 1;
  const prevClose = ind.bars[i-1].c;
  const chg = prevClose ? ((ind.bars[i].c - prevClose) / prevClose) * 100 : 0;

  const hitCurrent = isMatchAtBar(ind, i);
  const prevHitCurrent = isMatchAtBar(ind, i - 1);
  const newHitCurrent = hitCurrent && !prevHitCurrent;

  const hitPrev = prevHitCurrent;
  const prevHitPrev = n >= 3 ? isMatchAtBar(ind, i - 2) : false;
  const newHitPrev = hitPrev && !prevHitPrev;

  const signalWithin2Candles = newHitCurrent || newHitPrev;

  return {
    price: ind.bars[i].c,
    chg,
    ema5gt13: ind.ema5[i] > ind.ema13[i],
    ema13gt34: ind.ema13[i] > ind.ema34[i],
    bullish: ind.bullish[i],
    magicGreen: ind.magicGreen[i],
    trendFlip: ind.trendFlipBull[i],
    signalWithin2Candles
  };
}

let results = {};
let selectedSymbol = null;
let sortKey = "symbol";
let sortDir = 1;

function sortSymbols(symbols){
  return symbols.slice().sort((a,b)=>{
    const ra = results[a], rb = results[b];
    let va, vb;
    if(sortKey === "bars4h"){ va = ra && ra.trend4h ? ra.trend4h.bars : -Infinity; vb = rb && rb.trend4h ? rb.trend4h.bars : -Infinity; }
    else if(sortKey === "bars1d"){ va = ra && ra.trend1d ? ra.trend1d.bars : -Infinity; vb = rb && rb.trend1d ? rb.trend1d.bars : -Infinity; }
    else { va = a; vb = b; }
    if(va < vb) return -1 * sortDir;
    if(va > vb) return 1 * sortDir;
    return a.localeCompare(b);
  });
}

function updateSortIndicators(){
  document.querySelectorAll("th[data-sort]").forEach(th=>{
    const key = th.getAttribute("data-sort");
    const label = th.getAttribute("data-label") || th.textContent.replace(/[▲▼]\s*$/,"").trim();
    th.setAttribute("data-label", label);
    th.textContent = label + (key === sortKey ? (sortDir === 1 ? " ▲" : " ▼") : "");
  });
}
document.querySelectorAll("th[data-sort]").forEach(th=>{
  th.onclick = ()=>{
    const key = th.getAttribute("data-sort");
    if(sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
    renderTable();
  };
});

function trendCellHtml(t){
  if(!t) return `<span class="trendval dim">—</span>`;
  const cls = t.dir === "up" ? "up" : "down";
  const arrow = t.dir === "up" ? "▲" : "▼";
  return `<span class="trendval ${cls}">${arrow} ${t.bars}</span>`;
}

function renderTable(){
  const tbody = els("tbody");
  const hitsOnly = els("hitsOnly").checked;
  updateSortIndicators();
  const symbols = sortSymbols(Object.keys(results));
  if(!symbols.length){
    tbody.innerHTML = `<tr><td colspan="3" class="empty">No results yet. Click Run Scan.</td></tr>`;
    return;
  }
  let rows = "";
  for(const sym of symbols){
    const r = results[sym];
    if(!r || (!r.trend4h && !r.trend1d)) continue;
    if(hitsOnly && !(r.flags && r.flags.signalWithin2Candles)) continue;

    const isHit = r.flags && r.flags.signalWithin2Candles;
    rows += `<tr data-sym="${sym}" class="${sym===selectedSymbol?'selected':''}">
      <td class="sym">${sym} ${isHit ? '<span class="pill match">⚡ Signal</span>' : ''}</td>
      <td>${trendCellHtml(r.trend4h)}</td>
      <td>${trendCellHtml(r.trend1d)}</td>
    </tr>`;
  }
  tbody.innerHTML = rows || `<tr><td colspan="3" class="empty">No hits.</td></tr>`;
  tbody.querySelectorAll("tr[data-sym]").forEach(tr=>{
    tr.onclick = ()=>{ stopPlay(); selectSymbol(tr.getAttribute("data-sym")); };
  });
}
els("hitsOnly").onchange = ()=>{
  cfg.hitsOnly = els("hitsOnly").checked;
  saveCfg(cfg);
  renderTable();
};

function exportCsv(){
  const hitsOnly = els("hitsOnly").checked;
  const symbols = sortSymbols(Object.keys(results));
  const rows = [["Symbol","4H Trend","4H Bars","1D Trend","1D Bars","Signal Within 2 Bars"]];
  for(const sym of symbols){
    const r = results[sym];
    if(!r || (!r.trend4h && !r.trend1d)) continue;
    if(hitsOnly && !(r.flags && r.flags.signalWithin2Candles)) continue;
    rows.push([
      sym,
      r.trend4h ? r.trend4h.dir : "",
      r.trend4h ? r.trend4h.bars : "",
      r.trend1d ? r.trend1d.dir : "",
      r.trend1d ? r.trend1d.bars : "",
      (r.flags && r.flags.signalWithin2Candles) ? "YES" : "NO"
    ]);
  }
  const csv = rows.map(r => r.join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ripster_scan_${new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
els("exportCsvBtn").onclick = exportCsv;

async function scanTimeframe(timeframe, symbols, progressCb){
  const cache = barCaches[timeframe] || (barCaches[timeframe] = { bars: {} });
  const { start, end } = dateRangeFor(timeframe);

  const fullSymbols = [];
  const incGroups = {};
  for(const sym of symbols){
    const cached = cache.bars[sym];
    if(cached && cached.length){
      const lastMs = new Date(cached[cached.length-1].t).getTime();
      const fromIso = new Date(lastMs + 1000).toISOString();
      (incGroups[fromIso] = incGroups[fromIso] || []).push(sym);
    } else {
      fullSymbols.push(sym);
    }
  }

  const barsMap = {};
  if(fullSymbols.length){
    Object.assign(barsMap, await fetchMultiBars(fullSymbols, start, end, timeframe, progressCb));
  }
  for(const fromIso of Object.keys(incGroups)){
    const groupSymbols = incGroups[fromIso];
    Object.assign(barsMap, await fetchMultiBars(groupSymbols, fromIso, end, timeframe, progressCb));
  }

  const tfResults = {};
  for(const sym of symbols){
    const cachedBars = cache.bars[sym] || [];
    const freshBars = barsMap[sym] || [];
    let merged = fullSymbols.includes(sym) ? freshBars : mergeBars(cachedBars, freshBars);
    merged = trimBarsToRange(merged, start);
    cache.bars[sym] = merged;

    let raw = merged;
    if(timeframe !== "1Day") raw = raw.filter(b => isRegularSessionBar(b.t));
    if(raw.length < 60){ tfResults[sym] = null; continue; }
    const ind = computeIndicators(raw, cfg.params);
    tfResults[sym] = { ind, trend: trendBarsSinceChange(ind) };
  }

  Object.keys(cache.bars).forEach(sym => { if(!symbols.includes(sym)) delete cache.bars[sym]; });

  return tfResults;
}

async function runScan(opts){
  opts = opts || {};
  const silent = !!opts.silent;
  if(!cfg.apiKey || !cfg.apiSecret){ if(!silent) openSettings(); return; }
  const symbols = parseWatchlist();
  if(!symbols.length) return;

  if(!silent){
    els("scanBtn").disabled = true;
    els("progressWrap").classList.add("on");
    els("progressBar").style.width = "2%";
  }
  els("status").textContent = silent ? "Refreshing…" : "Fetching bars…";

  try{
    const total = TIMEFRAMES.length * symbols.length;
    let doneUnits = 0;
    const perTf = {};
    for(const timeframe of TIMEFRAMES){
      let prevInCall = 0;
      const progressCb = (doneInCall)=>{
        const overall = doneUnits + (doneInCall - prevInCall);
        prevInCall = doneInCall;
        if(!silent) els("progressBar").style.width = Math.round((overall/total)*100)+"%";
        els("status").textContent = `Fetched ${overall}/${total}…`;
      };
      perTf[timeframe] = await scanTimeframe(timeframe, symbols, progressCb);
      doneUnits += symbols.length;
    }

    saveBarCaches(barCaches);

    results = {};
    for(const sym of symbols){
      const r4h = perTf["4Hour"][sym];
      const r1d = perTf["1Day"][sym];
      const active = perTf[cfg.timeframe][sym];
      results[sym] = {
        ind: active ? active.ind : null,
        flags: active ? screenerFlags(active.ind) : null,
        trend4h: r4h ? r4h.trend : null,
        trend1d: r1d ? r1d.trend : null
      };
    }

    checkForNewHits();
    renderTable();

    const activeList = getSymbolOrder();
    if(selectedSymbol && results[selectedSymbol] && results[selectedSymbol].ind && (!els("hitsOnly").checked || (results[selectedSymbol].flags && results[selectedSymbol].flags.signalWithin2Candles))){
      drawChart(selectedSymbol);
    } else if(activeList.length > 0){
      selectSymbol(activeList[0]);
    }

    els("status").textContent = `Scan complete · ${symbols.length} symbols · ${new Date().toLocaleTimeString()}`;
  }catch(err){
    console.error(err);
    els("status").textContent = "Error: " + err.message;
  }finally{
    if(!silent){
      els("scanBtn").disabled = false;
      setTimeout(()=>{ els("progressWrap").classList.remove("on"); els("progressBar").style.width="0%"; }, 600);
    }
  }
}
els("scanBtn").onclick = ()=> runScan();
els("refreshBtn").onclick = ()=> runScan();

// Chart Setup
let chart=null, candleSeries=null, mtSegmentSeries=[];
let overlayCtx=null, currentInd=null;

function ensureChart(){
  if(chart) return;
  const container = els("chart");
  chart = LightweightCharts.createChart(container, {
    layout: { background:{color:"transparent"}, textColor:"#8b96a5" },
    grid: { vertLines:{color:"#182130"}, horzLines:{color:"#182130"} },
    rightPriceScale: { borderColor:"#232c3a" },
    timeScale: { borderColor:"#232c3a", timeVisible:true, secondsVisible:false },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    autoSize: true
  });
  
  candleSeries = chart.addCandlestickSeries({
    upColor:"#20d67b", downColor:"#FC0400", borderVisible:false,
    wickUpColor:"#20d67b", wickDownColor:"#FC0400"
  });

  overlayCtx = els("overlay").getContext("2d");
  chart.timeScale().subscribeVisibleLogicalRangeChange(renderOverlay);
  window.addEventListener("resize", ()=> setTimeout(renderOverlay, 50));
  initDrawingEvents();
}

function toChartTime(iso){ return Math.floor(new Date(iso).getTime()/1000); }

function clearMagicTrendSeries(){
  mtSegmentSeries.forEach(s => { try{ chart.removeSeries(s); }catch(e){} });
  mtSegmentSeries = [];
}

function updateMagicTrendSeries(){
  if(!currentInd || !chart) return;
  clearMagicTrendSeries();
  if(!els("showMagicTrend").checked) return;

  const ind = currentInd;
  const n = ind.bars.length;
  let i = 0;
  while(i < n){
    const isGreen = ind.magicGreen[i];
    let j = i;
    while(j+1 < n && ind.magicGreen[j+1] === isGreen) j++;

    const from = Math.max(i-1, 0);
    const segData = [];
    for(let k=from; k<=j; k++){
      segData.push({ time: toChartTime(ind.bars[k].t), value: ind.magicTrend[k] });
    }

    const isLastRun = (j === n-1);
    const series = chart.addLineSeries({
      color: isGreen ? "#20d67b" : "#FC0400",
      lineWidth: 2,
      lineStyle: LightweightCharts.LineStyle.Solid,
      priceLineVisible: isLastRun,
      priceLineStyle: LightweightCharts.LineStyle.Dotted,
      lastValueVisible: isLastRun,
      crosshairMarkerVisible: false
    });
    series.setData(segData);
    mtSegmentSeries.push(series);

    i = j + 1;
  }
}
els("showMagicTrend").onchange = updateMagicTrendSeries;

function setInitialVisibleRange(ind){
  const n = ind.bars.length;
  if(n === 0 || !chart) return;
  const lastTime = toChartTime(ind.bars[n-1].t);
  const firstTime = toChartTime(ind.bars[0].t);
  const cutoff = new Date(ind.bars[n-1].t);
  cutoff.setMonth(cutoff.getMonth() - 1);
  let fromTime = toChartTime(cutoff.toISOString());
  if(fromTime < firstTime) fromTime = firstTime;
  try{
    chart.timeScale().setVisibleRange({ from: fromTime, to: lastTime });
  }catch(e){
    chart.timeScale().fitContent();
  }
}

function drawChart(symbol){
  const entry = results[symbol];
  if(!entry || !entry.ind) return;
  ensureChart();
  currentInd = entry.ind;
  const ind = entry.ind;
  const n = ind.bars.length;

  const candleData = ind.bars.map((b,i)=>{
    const up = ind.magicGreen[i];
    const color = up ? "#20d67b" : "#FC0400";
    return {
      time: toChartTime(b.t), open:b.o, high:b.h, low:b.l, close:b.c,
      color, borderColor: color, wickColor: color
    };
  });
  candleSeries.setData(candleData);
  updateMagicTrendSeries();

  const MIN_MARKER_GAP = 4;
  const markers = [];
  let lastMarkerIdx = -Infinity;
  for(let i=0;i<n;i++){
    const isHit = isMatchAtBar(ind, i);
    const prevHit = i>0 && isMatchAtBar(ind, i-1);
    const isNewHit = isHit && !prevHit;
    if(isNewHit && (i - lastMarkerIdx) >= MIN_MARKER_GAP){
      markers.push({
        time: toChartTime(ind.bars[i].t),
        position: "belowBar",
        color: "#33e0ff",
        shape: "arrowUp",
        text: symbol
      });
      lastMarkerIdx = i;
    }
  }
  candleSeries.setMarkers(markers);

  setInitialVisibleRange(ind);
  els("chartSym").textContent = symbol;
  const last = ind.bars[n-1];
  els("chartPrice").textContent = `$${last.c.toFixed(2)}`;
  els("chartPanel").classList.add("open");
  els("chartPlaceholder").style.display = "none";
  setTimeout(renderOverlay, 60);
}

function resizeOverlay(){
  const wrap = els("chartWrap");
  const cv = els("overlay");
  const dpr = window.devicePixelRatio || 1;
  cv.width = wrap.clientWidth*dpr;
  cv.height = wrap.clientHeight*dpr;
  cv.style.width = wrap.clientWidth+"px";
  cv.style.height = wrap.clientHeight+"px";
  overlayCtx.setTransform(dpr,0,0,dpr,0,0);
}

  ['toolLine', 'toolHLine', 'toolFree'].forEach(id => els(id).classList.remove('active'));
  if(activeTool === 'line') els('toolLine').classList.add('active');
  if(activeTool === 'hline') els('toolHLine').classList.add('active');
  if(activeTool === 'free') els('toolFree').classList.add('active');
  els('overlay').classList.toggle('tool-active', !!activeTool);
}
els("toolLine").onclick = ()=> setTool("line");
els("toolHLine").onclick = ()=> setTool("hline");
els("toolFree").onclick = ()=> setTool("free");
els("clearDrawings").onclick = ()=>{ if(selectedSymbol) drawingsBySymbol[selectedSymbol] = []; renderOverlay(); };

function initDrawingEvents(){
  const cv = els("overlay");
  let isDown = false;
  let smoothX = 0, smoothY = 0;
  const MIN_DIST = 2;
  const SMOOTH_ALPHA = 0.35;

  function pointFromEvent(e){
    const rect = cv.getBoundingClientRect();
    return [e.clientX - rect.left, e.clientY - rect.top];
  }

  cv.addEventListener("pointerdown", (e)=>{
    if(!activeTool) return;
    isDown = true;
    cv.setPointerCapture(e.pointerId);
    const [x,y] = pointFromEvent(e);
    smoothX = x; smoothY = y;

    if(activeTool === "line") currentDraft = { type: "line", x1: x, y1: y, x2: x, y2: y };
    else if(activeTool === "hline") currentDraft = { type: "hline", y: y };
    else if(activeTool === "free") currentDraft = { type: "free", pts: [[x,y]] };
    renderOverlay();
  });

  cv.addEventListener("pointermove", (e)=>{
    if(!isDown || !currentDraft) return;
    const [x,y] = pointFromEvent(e);

    if(currentDraft.type === "line"){ currentDraft.x2 = x; currentDraft.y2 = y; }
    else if(currentDraft.type === "hline"){ currentDraft.y = y; }
    else if(currentDraft.type === "free"){
      smoothX += (x - smoothX) * SMOOTH_ALPHA;
      smoothY += (y - smoothY) * SMOOTH_ALPHA;
      const pts = currentDraft.pts;
      const last = pts[pts.length-1];
      const dist = Math.hypot(smoothX-last[0], smoothY-last[1]);
      if(dist >= MIN_DIST) pts.push([smoothX, smoothY]);
    }
    renderOverlay();
  });

  const stopDrawing = (e)=>{
    if(isDown && currentDraft){
      if(e && e.pointerId!==undefined && cv.hasPointerCapture && cv.hasPointerCapture(e.pointerId)){
        cv.releasePointerCapture(e.pointerId);
      }
      currentDrawings().push(currentDraft);
      currentDraft = null;
      isDown = false;
      renderOverlay();
    }
  };
  cv.addEventListener("pointerup", stopDrawing);
  cv.addEventListener("pointercancel", stopDrawing);
}

// Ripster Cloud Fill
function renderOverlay(){
  if(!chart || !currentInd || !overlayCtx) return;
  resizeOverlay();
  const wrap = els("chartWrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  overlayCtx.clearRect(0,0,w,h);

  const ind = currentInd;
  const ts = chart.timeScale();

  function buildPath(valsA, valsB){
    const ptsTop=[], ptsBot=[];
    for(let i=0;i<ind.bars.length;i++){
      const t = toChartTime(ind.bars[i].t);
      const x = ts.timeToCoordinate(t);
      if(x===null) continue;
      const ya = candleSeries.priceToCoordinate(valsA[i]);
      const yb = candleSeries.priceToCoordinate(valsB[i]);
      if(ya===null||yb===null) continue;
      ptsTop.push([x,ya]); ptsBot.push([x,yb]);
    }
    return {ptsTop, ptsBot};
  }

  function fillCloud(valsA, valsB, colorFn){
    const {ptsTop, ptsBot} = buildPath(valsA, valsB);
    if(ptsTop.length < 2) return;
    for(let i=0;i<ptsTop.length-1;i++){
      const bull = valsA[i] >= valsB[i];
      overlayCtx.beginPath();
      overlayCtx.moveTo(ptsTop[i][0], ptsTop[i][1]);
      overlayCtx.lineTo(ptsTop[i+1][0], ptsTop[i+1][1]);
      overlayCtx.lineTo(ptsBot[i+1][0], ptsBot[i+1][1]);
      overlayCtx.lineTo(ptsBot[i][0], ptsBot[i][1]);
      overlayCtx.closePath();
      overlayCtx.fillStyle = bull ? colorFn.up : colorFn.down;
      overlayCtx.fill();
    }
  }

  fillCloud(ind.ema5, ind.ema13, { up:"rgba(32,214,123,0.25)", down:"rgba(252,4,0,0.22)" });
  fillCloud(ind.ema34, ind.ema50, { up:"rgba(51,224,255,0.18)", down:"rgba(255,176,32,0.15)" });

  if(selectedSymbol){
    overlayCtx.save();
    overlayCtx.textAlign = "right";
    overlayCtx.fillStyle = "rgba(255,255,255,0.06)";
    overlayCtx.font = `bold ${Math.min(56, w*0.14)}px sans-serif`;
    overlayCtx.fillText(selectedSymbol, w-16, h/2);
    overlayCtx.restore();
  }

  const allDrawings = currentDraft ? [...currentDrawings(), currentDraft] : currentDrawings();
  overlayCtx.lineWidth = 2;
  overlayCtx.lineJoin = "round";
  overlayCtx.lineCap = "round";
  allDrawings.forEach(d => {
    overlayCtx.strokeStyle = "#33e0ff";
    if(d.type === "line"){
      overlayCtx.beginPath();
      overlayCtx.moveTo(d.x1, d.y1);
      overlayCtx.lineTo(d.x2, d.y2);
      overlayCtx.stroke();
    } else if(d.type === "hline"){
      overlayCtx.beginPath();
      overlayCtx.setLineDash([4, 4]);
      overlayCtx.moveTo(0, d.y);
      overlayCtx.lineTo(w, d.y);
      overlayCtx.stroke();
      overlayCtx.setLineDash([]);
    } else if(d.type === "free" && d.pts.length > 1){
      overlayCtx.beginPath();
      const pts = d.pts;
      overlayCtx.moveTo(pts[0][0], pts[0][1]);
      if(pts.length === 2){
        overlayCtx.lineTo(pts[1][0], pts[1][1]);
      } else {
        for(let i=1; i<pts.length-1; i++){
          const midX = (pts[i][0]+pts[i+1][0])/2;
          const midY = (pts[i][1]+pts[i+1][1])/2;
          overlayCtx.quadraticCurveTo(pts[i][0], pts[i][1], midX, midY);
        }
        const last = pts[pts.length-1];
        overlayCtx.lineTo(last[0], last[1]);
      }
      overlayCtx.stroke();
    }
  });
}

// Chart Export with Watermark
els("exportBtn").onclick = ()=>{
  if(!chart || !selectedSymbol) return;
  const chartCanvas = els("chart").querySelector("canvas");
  const overlayCanvas = els("overlay");
  if(!chartCanvas) return;

  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = chartCanvas.width;
  exportCanvas.height = chartCanvas.height;
  const ctx = exportCanvas.getContext("2d");

  ctx.fillStyle = "#0a0e14";
  ctx.fillRect(0, 0, exportCanvas.width, exportCanvas.height);

  ctx.drawImage(chartCanvas, 0, 0);
  ctx.drawImage(overlayCanvas, 0, 0);

  const dpr = window.devicePixelRatio || 1;
  const textSym = selectedSymbol;
  const textTf = (cfg.timeframe === "1Day" ? "1D" : "4H") + " · Ripster Cloud";
  const dateStr = new Date().toLocaleDateString() + " " + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

  ctx.save();
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
  ctx.font = `bold ${56 * dpr}px sans-serif`;
  ctx.fillText(textSym, exportCanvas.width - (30 * dpr), exportCanvas.height / 2);

  ctx.textAlign = "left";
  ctx.font = `bold ${15 * dpr}px sans-serif`;
  ctx.fillStyle = "#33e0ff";
  ctx.fillText(`${textSym} - ${textTf}`, 20 * dpr, 30 * dpr);

  ctx.font = `${11 * dpr}px sans-serif`;
  ctx.fillStyle = "#7d8899";
  ctx.fillText(`Exported: ${dateStr}`, 20 * dpr, 48 * dpr);
  ctx.restore();

  const link = document.createElement("a");
  link.download = `${selectedSymbol}_${cfg.timeframe === "1Day" ? "1D" : "4H"}_Ripster_Cloud.png`;
  link.href = exportCanvas.toDataURL("image/png");
  link.click();
};

function selectSymbol(sym){
  selectedSymbol = sym;
  renderTable();
  drawChart(sym);
}

els("closeChart").onclick = ()=>{
  stopPlay();
  els("chartPanel").classList.remove("open");
  els("chartPlaceholder").style.display = "block";
};

let playTimer = null;
let isPlaying = false;
function getSymbolOrder(){
  let symbols = Object.keys(results);
  if(els("hitsOnly").checked){
    symbols = symbols.filter(sym => results[sym] && results[sym].flags && results[sym].flags.signalWithin2Candles);
  }
  return sortSymbols(symbols);
}
function advanceChart(step){
  const order = getSymbolOrder();
  if(!order.length) return;
  let idx = order.indexOf(selectedSymbol);
  idx = idx === -1 ? 0 : (idx + step + order.length) % order.length;
  selectSymbol(order[idx]);
}
function stopPlay(){
  if(playTimer){ clearInterval(playTimer); playTimer = null; }
  isPlaying = false;
  els("playPauseBtn").textContent = "▶ Play";
  els("playPauseBtn").classList.remove("active");
}
function startPlay(){
  const order = getSymbolOrder();
  if(order.length < 1) return;
  if(!selectedSymbol || !order.includes(selectedSymbol)) selectSymbol(order[0]);
  if(order.length === 1) return;
  isPlaying = true;
  els("playPauseBtn").textContent = "⏸ Pause";
  els("playPauseBtn").classList.add("active");
  const ms = Math.max(1, parseInt(els("playInterval").value, 10) || 3) * 1000;
  if(playTimer) clearInterval(playTimer);
  playTimer = setInterval(()=> advanceChart(1), ms);
}
els("playPauseBtn").onclick = ()=> isPlaying ? stopPlay() : startPlay();
els("playInterval").onchange = ()=>{ if(isPlaying) startPlay(); };

let autoRefreshTimer = null;
function applyAutoRefresh(){
  if(autoRefreshTimer){ clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
  if(cfg.autoRefresh){
    const ms = Math.max(1, cfg.autoRefreshMinutes || 5) * 60000;
    autoRefreshTimer = setInterval(()=> runScan({ silent: true }), ms);
  }
}
els("hitsOnly").checked = cfg.hitsOnly !== undefined ? cfg.hitsOnly : true;
els("autoRefresh").checked = cfg.autoRefresh;
els("autoRefreshInterval").value = String(cfg.autoRefreshMinutes || 5);
els("notifyOnHits").checked = cfg.notifyOnHits;
els("autoRefresh").onchange = ()=>{
  cfg.autoRefresh = els("autoRefresh").checked;
  saveCfg(cfg);
  applyAutoRefresh();
};
els("autoRefreshInterval").onchange = ()=>{
  cfg.autoRefreshMinutes = parseInt(els("autoRefreshInterval").value, 10);
  saveCfg(cfg);
  applyAutoRefresh();
};
els("notifyOnHits").onchange = ()=>{
  cfg.notifyOnHits = els("notifyOnHits").checked;
  saveCfg(cfg);
  if(cfg.notifyOnHits && "Notification" in window && Notification.permission === "default"){
    Notification.requestPermission();
  }
};

let lastMatchedSet = new Set();
let hasCompletedAnyScan = false;
function currentMatchedSymbols(){
  const set = new Set();
  for(const sym of Object.keys(results)){
    const r = results[sym];
    if(r && r.flags && r.flags.signalWithin2Candles) set.add(sym);
  }
  return set;
}
function checkForNewHits(){
  const nowMatched = currentMatchedSymbols();
  if(cfg.notifyOnHits && hasCompletedAnyScan && "Notification" in window && Notification.permission === "granted"){
    const newly = [...nowMatched].filter(s => !lastMatchedSet.has(s));
    if(newly.length){
      const title = newly.length === 1 ? `${newly[0]} is a new match` : `${newly.length} new matches`;
      const body = newly.slice(0, 6).join(", ") + (newly.length > 6 ? "…" : "");
      try{ new Notification(title, { body, icon: "icon-192.png" }); }catch(e){}
    }
  }
  lastMatchedSet = nowMatched;
  hasCompletedAnyScan = true;
}

function hydrateFromCache(){
  if(!cfg.apiKey || !cfg.apiSecret) return;
  const symbols = parseWatchlist();
  if(!symbols.length) return;
  let any = false;
  results = {};
  for(const sym of symbols){
    const entry = { ind: null, flags: null, trend4h: null, trend1d: null };
    for(const timeframe of TIMEFRAMES){
      const cache = barCaches[timeframe];
      const cached = cache && cache.bars[sym];
      if(!cached || !cached.length) continue;
      let raw = cached;
      if(timeframe !== "1Day") raw = raw.filter(b => isRegularSessionBar(b.t));
      if(raw.length < 60) continue;
      const ind = computeIndicators(raw, cfg.params);
      const trend = trendBarsSinceChange(ind);
      if(timeframe === "4Hour") entry.trend4h = trend; else entry.trend1d = trend;
      if(timeframe === cfg.timeframe){ entry.ind = ind; entry.flags = screenerFlags(ind); }
      any = true;
    }
    results[sym] = entry;
  }
  if(any){
    renderTable();
    lastMatchedSet = currentMatchedSymbols();
    hasCompletedAnyScan = true;
    els("status").textContent = "Showing cached results — refreshing…";
    
    const activeList = getSymbolOrder();
    if(activeList.length > 0 && !selectedSymbol){
      selectSymbol(activeList[0]);
    }
  }
}

hydrateFromCache();
applyAutoRefresh();
if(cfg.apiKey && cfg.apiSecret) setTimeout(()=> runScan({ silent: true }), 400);

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

})();
</script>
